<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Camino de Fe</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#2b1f45;--ac:#8a5cff;--gold:#ffc94d;--card:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:#1b1240;color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
#app{position:absolute;inset:0;overflow:hidden}
#screen{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,201,77,.35),rgba(255,255,255,0) 45%),linear-gradient(160deg,#4b2fb0,#8a2fb0 55%,#c23b8f);color:#fff;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 16px;text-align:center;overflow-y:auto;touch-action:pan-y}
.logo{font-size:42px;line-height:1.1;font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,#fff,var(--gold),#fff);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0 2px;animation:pop .45s backwards,glow 2.6s infinite}
.tag{font-size:13px;opacity:.85;margin-top:-8px}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px rgba(255,255,255,.3))}50%{filter:drop-shadow(0 0 14px rgba(255,201,77,.8))}}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes popIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}70%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.b{font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:#fff;border:2px solid var(--ac);border-radius:16px;padding:13px 20px;min-width:150px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.b.p{background:linear-gradient(90deg,var(--gold),#ff9f4d);color:#3a2500;border-color:#fff;box-shadow:0 5px 16px rgba(255,159,28,.5)}
.b.s2{background:linear-gradient(90deg,#8a5cff,#c23b8f);color:#fff;border-color:#fff}
.b.d{opacity:.45;pointer-events:none;filter:grayscale(.6)}
.b.l{color:#fff;background:none;border:none;box-shadow:none;text-decoration:underline;font-size:13px;opacity:.85;min-width:0;padding:6px}
.card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:14px;width:100%;max-width:360px;backdrop-filter:blur(2px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:360px}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border-radius:20px;padding:6px 12px;font-weight:700;font-size:13px}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:380px;padding:10px 0 30px}
.node{display:flex;align-items:center;gap:12px;width:100%}
.node .dot{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;border:3px solid var(--gold);box-shadow:0 3px 10px rgba(0,0,0,.3);flex:none;position:relative}
.node .dot.done{background:linear-gradient(135deg,#6fe3a5,#19a7ff);color:#fff;border-color:#fff}
.node .dot.lock{filter:grayscale(1);opacity:.5}
.node .info{flex:1;text-align:left;font-size:13px}
.node .stars{font-size:12px;color:var(--gold)}
.story{font-size:15px;line-height:1.5;background:rgba(0,0,0,.22);border-radius:14px;padding:16px;max-width:380px}
.qbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:#fff;border:2px solid rgba(138,92,255,.5);border-radius:14px;padding:13px 14px;text-align:left;cursor:pointer}
.opt.ok{background:linear-gradient(90deg,#6fe3a5,#19c37d);color:#07321f;border-color:#fff}
.opt.bad{background:linear-gradient(90deg,#ff6f6f,#ff3d6b);color:#fff;border-color:#fff;animation:shake .4s}
.verse{background:rgba(255,201,77,.18);border:1px solid rgba(255,201,77,.6);border-radius:12px;padding:10px 12px;font-size:13px;text-align:left;max-width:380px}
.hearts{font-size:18px;letter-spacing:2px}
#float{position:absolute;inset:0;pointer-events:none;z-index:20}
.fx{position:absolute;font-weight:900;font-size:22px;color:var(--gold);text-shadow:0 2px 4px rgba(0,0,0,.4);animation:floatUp 1s forwards}
#banner{position:absolute;left:0;right:0;bottom:0;height:7.5%;background:#1a1130;color:#bba9e8;font-size:12px;display:flex;align-items:center;justify-content:center;border-top:1px solid rgba(255,255,255,.1)}
.avimg{font-size:48px}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px}
.shopcard{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.shopcard.eq{border-color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--ac)}
h3{margin:6px 0 2px;font-size:15px;color:#ffe9b0}
.note{font-size:12px;opacity:.85;max-width:380px}
::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="app"><div id="screen"></div><div id="float"></div><div id="banner">📢 Banner publicitario (simulado)</div></div>
<script src="native.js"></script>
<script>
const KEY='cf_save_v1';
const BOOKS=[
{id:'genesis',name:'Génesis',ac:'#8a5cff',avail:true,levels:[
 {t:'La Creación',s:'En el principio, Dios creó los cielos y la tierra. Separó la luz de la oscuridad y llamó a la luz "día" y a la oscuridad "noche".',
  q:'¿Qué separó Dios en el primer día de la creación?',o:['El mar y la tierra','La luz y la oscuridad','Los animales y las plantas','El cielo y las estrellas'],c:1,v:'Génesis 1:3-5',e:'Dios dijo "Sea la luz" y separó la luz de las tinieblas, llamando "día" a la luz y "noche" a la oscuridad.'},
 {t:'El Jardín del Edén',s:'Dios formó al hombre del polvo de la tierra y sopló en él aliento de vida. Lo puso en el hermoso Jardín del Edén para que lo cuidara.',
  q:'¿De qué formó Dios al primer hombre?',o:['De agua','De polvo de la tierra','De una semilla','De luz'],c:1,v:'Génesis 2:7',e:'Dios formó al hombre del polvo de la tierra y sopló en su nariz aliento de vida.'},
 {t:'Eva',s:'Dios vio que el hombre no debía estar solo, así que creó a la mujer a partir de una costilla de Adán para que fuera su compañera.',
  q:'¿De dónde formó Dios a la mujer?',o:['De una costilla de Adán','De barro','De una flor','Del mar'],c:0,v:'Génesis 2:21-22',e:'Dios tomó una costilla de Adán mientras dormía y formó a la mujer, Eva.'},
 {t:'La Serpiente y el Fruto',s:'La serpiente engañó a Eva para que comiera del único árbol prohibido en el jardín: el Árbol del Conocimiento del bien y del mal.',
  q:'¿Qué animal engañó a Eva en el Jardín del Edén?',o:['Un león','Un águila','Una serpiente','Un lobo'],c:2,v:'Génesis 3:1-6',e:'La serpiente, la más astuta de los animales, tentó a Eva a comer del fruto prohibido.'},
 {t:'Caín y Abel',s:'Adán y Eva tuvieron dos hijos, Caín y Abel. Por envidia, Caín mató a su hermano Abel, convirtiéndose en el primer asesinato de la historia.',
  q:'¿Quién mató a su hermano Abel?',o:['Set','Caín','Noé','Lamec'],c:1,v:'Génesis 4:8',e:'Caín, lleno de celos porque Dios había aceptado la ofrenda de Abel, lo mató en el campo.'},
 {t:'El Arca de Noé',s:'La maldad de los hombres llenó la tierra, y Dios decidió enviar un gran diluvio. Pero le pidió a Noé que construyera un arca para salvar a su familia y a los animales.',
  q:'¿Qué construyó Noé por orden de Dios?',o:['Una torre','Un templo','Un arca','Un pozo'],c:2,v:'Génesis 6:14',e:'Dios le ordenó a Noé construir un arca de madera para salvarse del diluvio junto a su familia y los animales.'},
 {t:'El Diluvio',s:'Llovió durante cuarenta días y cuarenta noches. El agua cubrió toda la tierra, pero el arca de Noé flotó a salvo sobre las aguas.',
  q:'¿Cuántos días y noches llovió durante el diluvio?',o:['7','40','100','12'],c:1,v:'Génesis 7:12',e:'La lluvia cayó sobre la tierra durante cuarenta días y cuarenta noches.'},
 {t:'El Arco Iris',s:'Cuando las aguas se secaron, Dios puso un arco iris en el cielo como señal de su promesa de no volver a destruir la tierra con un diluvio.',
  q:'¿Qué puso Dios en el cielo como señal de su promesa?',o:['Una estrella','El arco iris','Una paloma','El sol'],c:1,v:'Génesis 9:13',e:'Dios estableció el arco iris como señal del pacto entre Él y toda la tierra.'},
 {t:'La Torre de Babel',s:'Los hombres quisieron construir una torre que llegara hasta el cielo. Para frenar su orgullo, Dios confundió su idioma y los dispersó por el mundo.',
  q:'¿Qué hizo Dios para detener la construcción de la Torre de Babel?',o:['Destruyó la torre con fuego','Confundió sus idiomas','Envió un terremoto','Mandó una plaga'],c:1,v:'Génesis 11:7-9',e:'Dios confundió el lenguaje de los hombres para que no pudieran entenderse, y la construcción se detuvo.'},
 {t:'El Llamado de Abraham',s:'Dios llamó a Abraham y le prometió que sería padre de una gran nación, y que a través de él todas las familias de la tierra serían bendecidas.',
  q:'¿Qué le prometió Dios a Abraham?',o:['Mucho oro','Ser padre de una gran nación','Un reino en Egipto','Vivir para siempre'],c:1,v:'Génesis 12:2-3',e:'Dios prometió a Abraham que haría de él una gran nación y que sería bendición para todas las familias de la tierra.'},
 {t:'Sodoma y Gomorra',s:'Las ciudades de Sodoma y Gomorra eran tan malvadas que Dios decidió destruirlas, pero salvó a Lot y su familia por su justicia.',
  q:'¿A quién salvó Dios de la destrucción de Sodoma?',o:['A Lot y su familia','A Abraham','A Isaac','A un rey'],c:0,v:'Génesis 19:29',e:'Dios se acordó de Abraham y sacó a Lot de en medio de la destrucción de las ciudades.'},
 {t:'Isaac, el hijo de la promesa',s:'Aunque Abraham y Sara eran ya muy ancianos, Dios cumplió su promesa y les dio un hijo llamado Isaac, heredero de la promesa divina.',
  q:'¿Cómo se llamó el hijo que Dios le dio a Abraham y Sara en su vejez?',o:['Jacob','Isaac','Ismael','José'],c:1,v:'Génesis 21:2-3',e:'Sara concibió y dio a luz un hijo en su vejez, y Abraham lo llamó Isaac, tal como Dios le había dicho.'}
]},
{id:'exodo',name:'Éxodo',ac:'#19a7ff',avail:false,levels:[]},
{id:'reyes',name:'Reyes',ac:'#ff9f4d',avail:false,levels:[]},
{id:'evangelios',name:'Evangelios',ac:'#ff5d9e',avail:false,levels:[]},
];

const AVATARS=[
 {id:'moises',n:'Moisés',e:'🧔🏽',cost:0},
 {id:'david',n:'David',e:'🧑🏽‍🎤',cost:40},
 {id:'ester',n:'Ester',e:'👸🏽',cost:60},
 {id:'daniel',n:'Daniel',e:'🧑🏽',cost:80},
 {id:'pedro',n:'Pedro',e:'🧔🏻',cost:100},
 {id:'pablo',n:'Pablo',e:'👨🏻‍🦲',cost:120},
];

function load(){
 try{return JSON.parse(localStorage.getItem(KEY))||def();}catch(e){return def();}
}
function def(){
 return {gems:20,hearts:3,heartT:0,avatar:'moises',owned:['moises'],progress:{genesis:0},stars:{},streak:1,lastDay:0,music:.7,sfx:.8,noAds:false};
}
let S=load();
function save(){localStorage.setItem(KEY,JSON.stringify(S));}

let scene='menu', curBook=null, curLevel=0, curQ=0, correctCount=0, picked=-1;
const el=document.getElementById('screen');
const floatEl=document.getElementById('float');

function fx(txt,x,y){
 const d=document.createElement('div');
 d.className='fx';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';
 floatEl.appendChild(d);setTimeout(()=>d.remove(),1000);
}

function checkHeartRegen(){
 if(S.hearts<3 && S.heartT){
  const mins=(Date.now()-S.heartT)/60000;
  const regen=Math.floor(mins/20);
  if(regen>0){S.hearts=Math.min(3,S.hearts+regen); S.heartT = S.hearts<3? Date.now() - (mins%20)*60000 : 0; save();}
 }
}
function checkStreak(){
 const day=Math.floor(Date.now()/86400000);
 if(S.lastDay===0){S.lastDay=day;S.streak=1;}
 else if(day===S.lastDay+1){S.lastDay=day;S.streak++;S.gems+=5;save();}
 else if(day>S.lastDay+1){S.lastDay=day;S.streak=1;}
}
checkHeartRegen();checkStreak();

function go(s){scene=s;render();window.scrollTo(0,0);}

function render(){
 if(window.Native&&Native.isNative&&Native.ready){
  if(scene==='menu'||scene==='booklist'||scene==='levellist') Native.showBanner(); else Native.hideBanner();
 }
 el.innerHTML = SCREENS[scene]();
 el.scrollTop=0;
}

const SCREENS = {
menu:()=>`
 <div class="logo">⛪ CAMINO DE FE</div>
 <div class="tag">Aventura Bíblica</div>
 <div class="row" style="justify-content:center;gap:16px;margin:4px 0 8px">
  <span class="chip">💎 ${S.gems}</span>
  <span class="chip">🔥 ${S.streak} día${S.streak===1?'':'s'}</span>
 </div>
 <div style="font-size:54px;margin:4px 0">${AVATARS.find(a=>a.id===S.avatar).e}</div>
 <button class="b p" onclick="go('booklist')">▶ Jugar</button>
 <button class="b s2" onclick="go('shop')">🛍 Tienda</button>
 <button class="b" onclick="go('settings')">⚙ Ajustes</button>
 <p class="note">Recorré la Biblia libro por libro: historias narradas y preguntas para aprender jugando.</p>
`,
booklist:()=>`
 <div class="logo" style="font-size:26px">📖 Elegí un libro</div>
 <div class="path" style="max-width:380px">
  ${BOOKS.map(b=>{
   const done=(S.progress[b.id]||0);
   const total=b.levels.length;
   return b.avail? `
    <div class="node" style="cursor:pointer" onclick="openBook('${b.id}')">
     <div class="dot" style="border-color:${b.ac}">📜</div>
     <div class="info"><b>${b.name}</b><br><span style="opacity:.8">${done}/${total} completados</span></div>
    </div>` : `
    <div class="node">
     <div class="dot lock">🔒</div>
     <div class="info"><b>${b.name}</b><br><span style="opacity:.7">Próximamente</span></div>
    </div>`;
  }).join('')}
 </div>
 <button class="b l" onclick="go('menu')">← Volver</button>
`,
levellist:()=>{
 const b=curBook, done=S.progress[b.id]||0;
 return `
 <div class="logo" style="font-size:24px">${b.name}</div>
 <div class="hearts">${'❤️'.repeat(S.hearts)}${'🖤'.repeat(3-S.hearts)}</div>
 <div class="path">
  ${b.levels.map((lv,i)=>{
   const unlocked=i<=done, st=S.stars[b.id+i]||0, isDone=i<done;
   return `<div class="node" style="${unlocked?'cursor:pointer':''}" ${unlocked?`onclick="openLevel(${i})"`:''}>
    <div class="dot ${isDone?'done':''} ${unlocked?'':'lock'}">${unlocked?(isDone?'✔':(i+1)):'🔒'}</div>
    <div class="info"><b>${lv.t}</b><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div></div>
   </div>`;
  }).join('')}
 </div>
 <button class="b l" onclick="go('booklist')">← Libros</button>
`;},
story:()=>{
 const lv=curBook.levels[curLevel];
 return `
 <div class="logo" style="font-size:22px">${lv.t}</div>
 <div style="font-size:40px">${AVATARS.find(a=>a.id===S.avatar).e}</div>
 <div class="story">${lv.s}</div>
 <button class="b p" onclick="startQuestion()">Continuar →</button>
`;},
question:()=>{
 const lv=curBook.levels[curLevel];
 return `
 <div class="row" style="justify-content:space-between;max-width:380px">
  <span class="hearts">${'❤️'.repeat(S.hearts)}</span>
  <span class="chip">💎 ${S.gems}</span>
 </div>
 <h3>${lv.t}</h3>
 <div class="qbox">
  <div class="story" style="font-size:14px;padding:12px">${lv.q}</div>
  ${lv.o.map((op,i)=>{
   let cls='opt';
   if(picked>=0){ if(i===lv.c) cls+=' ok'; else if(i===picked) cls+=' bad'; }
   return `<div class="${cls}" ${picked<0?`onclick="answer(${i})"`:''}>${op}</div>`;
  }).join('')}
 </div>
 ${picked>=0?feedbackBlock(lv):''}
`;},
nohearts:()=>`
 <div class="logo" style="font-size:26px">💔 Sin vidas</div>
 <div style="font-size:50px">😢</div>
 <p class="note">Te quedaste sin corazones. Recuperás uno cada 20 minutos, o mirá un video para recuperarlos todos ahora.</p>
 <button class="b p" onclick="watchAdForHearts()">🎬 Ver video y recuperar vidas</button>
 <button class="b l" onclick="go('levellist')">Esperar / volver a libros</button>
`,
shop:()=>`
 <div class="logo" style="font-size:26px">🛍 Tienda</div>
 <div class="chip">💎 ${S.gems}</div>
 <h3>Personajes guía</h3>
 <div class="shopgrid">
  ${AVATARS.map(a=>{
   const owned=S.owned.includes(a.id), eq=S.avatar===a.id;
   return `<div class="shopcard ${eq?'eq':''}">
    <div class="avimg">${a.e}</div><b>${a.n}</b>
    ${eq?`<span style="font-size:12px;color:var(--gold)">✔ En uso</span>`
     : owned? `<button class="b" style="min-width:0;padding:8px 10px;font-size:12px" onclick="useAvatar('${a.id}')">Usar</button>`
     : `<button class="b p" style="min-width:0;padding:8px 10px;font-size:12px" onclick="buyAvatar('${a.id}')">💎 ${a.cost}</button>`}
   </div>`;
  }).join('')}
 </div>
 <p class="note">Los personajes son solo decorativos: te acompañan en tu camino, no cambian la dificultad.</p>
 <button class="b l" onclick="go('menu')">← Volver</button>
`,
settings:()=>`
 <div class="logo" style="font-size:26px">⚙ Ajustes</div>
 <div class="card">
  <div class="row"><span>🎵 Música</span><input type="range" min="0" max="1" step="0.05" value="${S.music}" oninput="S.music=+this.value;save()"></div>
  <div class="row" style="margin-top:10px"><span>🔊 Sonido</span><input type="range" min="0" max="1" step="0.05" value="${S.sfx}" oninput="S.sfx=+this.value;save()"></div>
 </div>
 <button class="b" onclick="if(confirm('¿Reiniciar todo tu progreso?')){S=def();save();go('menu')}">Reiniciar progreso</button>
 <button class="b l" onclick="go('menu')">← Volver</button>
`,
};

function openBook(id){curBook=BOOKS.find(b=>b.id===id); go('levellist');}
function openLevel(i){curLevel=i;curQ=0;correctCount=0;picked=-1;go('story');}
function startQuestion(){picked=-1;go('question');}

function feedbackBlock(lv){
 if(picked===lv.c){
  return `<div class="verse" style="border-color:#6fe3a5;background:rgba(111,227,165,.18)">✔ ¡Correcto! +10 💎</div>
   <button class="b p" onclick="finishLevel()">Continuar →</button>`;
 }
 return `<div class="verse">📖 <b>${lv.v}</b><br>${lv.e}</div>
  <button class="b" onclick="picked=-1;render()">Intentar de nuevo</button>`;
}

function answer(i){
 const lv=curBook.levels[curLevel];
 picked=i;
 if(i===lv.c){
  correctCount++; S.gems+=10; save();
  fx('+10 💎', window.innerWidth/2-20, 120);
  if(Native&&Native.haptic) Native.haptic(20);
 } else {
  if(S.hearts>0){ S.hearts--; if(S.hearts===0) S.heartT=Date.now(); save(); }
  if(S.hearts===0){ render(); setTimeout(()=>go('nohearts'),900); return; }
 }
 render();
}

async function finishLevel(){
 const done=S.progress[curBook.id]||0;
 if(curLevel>=done) S.progress[curBook.id]=curLevel+1;
 const stars = correctCount>=1?3:3; // every level here = 1 question; first-try = 3 stars
 const key=curBook.id+curLevel;
 S.stars[key]=Math.max(S.stars[key]||0,3);
 save();
 if(window.Native && Native.isNative && (curLevel+1)%3===0){ try{ await Native.showAd('interstitial'); }catch(e){} }
 go('levellist');
}

function useAvatar(id){S.avatar=id;save();render();}
function buyAvatar(id){
 const a=AVATARS.find(x=>x.id===id);
 if(S.gems>=a.cost){S.gems-=a.cost;S.owned.push(id);S.avatar=id;save();render();}
 else fx('Faltan 💎', window.innerWidth/2-30, 200);
}

async function watchAdForHearts(){
 if(!window.Native) return;
 const ok = await Native.showAd('rewarded');
 if(ok){ S.hearts=3; S.heartT=0; save(); render(); }
}
window.watchAdForHearts=watchAdForHearts;

if(window.Native){ Native.init().then(render); }
render();
</script>
</body>
</html>
